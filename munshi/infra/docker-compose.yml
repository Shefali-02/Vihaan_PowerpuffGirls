name: munshi
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: munshi
      POSTGRES_PASSWORD: munshi
      POSTGRES_DB: munshi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munshi"]
      interval: 3s
      retries: 20

  chain:
    build: { context: .., dockerfile: infra/Dockerfile.chain }
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 30

  chain-deploy:  # one-shot: deploys AnchorRegistry and writes deployments/local.json into the shared volume
    build: { context: .., dockerfile: infra/Dockerfile.chain }
    command: ["npx", "hardhat", "run", "scripts/deploy.js", "--network", "localhost"]
    environment:
      CHAIN_RPC_URL: http://chain:8545
    volumes: [deployments:/chain/deployments]
    depends_on:
      chain: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://munshi:munshi@db:5432/munshi
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      LLM_MODE: ${LLM_MODE:-mock}
      PRUNE_BASE_URL: ${PRUNE_BASE_URL:-https://prune.example}
      PRUNE_API_KEY: ${PRUNE_API_KEY:-}
      ANCHOR_MODE: ${ANCHOR_MODE:-hardhat}
      CHAIN_RPC_URL: http://chain:8545
      DEPLOYMENT_FILE: /app/chain/deployments/local.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      EXPORT_OPENAPI: "false"
    volumes: [deployments:/app/chain/deployments:ro]
    depends_on:
      db: { condition: service_healthy }
      chain-deploy: { condition: service_completed_successfully }

volumes:
  pgdata:
  deployments:
